# Must match APP_ID in src/shared/config.ts, and must not change after the first release.
appId: io.github.forthewhimsy.whimwatch
productName: WhimWatch
copyright: Copyright © 2026 WhimWatch contributors
directories:
  output: dist
  buildResources: build
# Only the build output and package.json ship. Each platform's `files` below REPLACES this list (it
# isn't merged), so they repeat it: a list with only exclusions would package the whole project.
files:
  - out/**
  - package.json
  - '!**/*.map'
# Executables and WebAssembly must live outside app.asar to be run/loaded.
asarUnpack:
  - node_modules/7zip-bin/**
  # The RAR worker thread loads node-unrar-js from disk.
  - node_modules/node-unrar-js/**
electronFuses:
  runAsNode: false
  # Sign-in cookies for LoversLab/Patreon are encrypted at rest (DPAPI / Keychain / libsecret).
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  # Each platform ships only its own 7-Zip binary.
  files:
    - out/**
    - package.json
    - '!**/*.map'
    - '!node_modules/7zip-bin/{linux,mac}/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
# Installs for the current user (no administrator prompt) and adds a Start menu entry. The finish
# page offers "Run WhimWatch now" (ticked) and "Create a desktop shortcut" (not ticked) — see
# build/installer.nsh, which also creates the Start menu entry the template can miss.
#
# Not oneClick: a one-click NSIS installer has no finish page by design, so it closed in silence and
# left no way to tell whether it had worked. The extra page is the confirmation. Before it, the user
# can choose where WhimWatch goes (it defaults to %LOCALAPPDATA%\Programs\WhimWatch, as before), on
# a first install only: once installed, a newer Setup updates it where it is without asking.
# build/installer.nsh makes the choice safe: WhimWatch always goes in a WhimWatch folder of its own,
# since uninstalling deletes the install folder whole, and Program Files and Windows are refused,
# since this per-user installer can't write there. Still no license page and no install-mode page.
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Never made automatically; only the finish-page checkbox makes one.
  createDesktopShortcut: false
  # Ticks "Run WhimWatch now" by default.
  runAfterFinish: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}
  # A fresh temp folder per launch, instead of one folder shared by every launch of this build.
  # The portable exe deletes and re-extracts its copy every time either way, so the shared folder
  # bought nothing — but when something holds a file open (antivirus mid-scan, a leftover process),
  # the delete and the re-extract both skip that file and the shared folder stays incomplete. A copy
  # missing icudtl.dat kills Chromium before any WhimWatch code runs: no window, no error, nothing in
  # the log, and every later launch lands in the same folder and fails the same way until it's deleted
  # by hand. With no shared path there is nothing to land in.
  unpackDirName: false
mac:
  category: public.app-category.utilities
  files:
    - out/**
    - package.json
    - '!**/*.map'
    - '!node_modules/7zip-bin/{linux,win}/**'
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  category: Utility
  synopsis: Keeps track of updates for your mods
  maintainer: WhimWatch contributors <https://github.com/forthewhimsy/whimwatch>
  files:
    - out/**
    - package.json
    - '!**/*.map'
    - '!node_modules/7zip-bin/{mac,win}/**'
  target:
    # .deb for Debian/Ubuntu and .rpm for Fedora/openSUSE install through the system's software app.
    # Ubuntu 24.04+ blocks the Chromium sandbox inside AppImages, so those distributions should use the .deb.
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: AppImage
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
