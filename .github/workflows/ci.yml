name: CI

# Every pull request and every push to main: lint, typecheck, tests on all three systems, and a
# packaging check. Nothing is published; releases come from tags (release.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # A changelog note that can't be read would otherwise only show up at release time.
      - run: npm run check-changes

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # Builds each platform's app and checks what's inside, so packaging problems (icons, unpacked
  # binaries, stray files, licence notices) show up before a release is tagged. Windows also
  # compiles the NSIS installer — see the build step for why.
  package:
    name: Package check (${{ matrix.os }})
    needs: [checks, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Windows builds the installer rather than just the unpacked app: makensis is the only thing
      # that ever compiles build/installer.nsh, and without this an error in it would first surface
      # when a release is tagged — the one build nobody wants to find it in. It costs about half a
      # minute over --dir, and the installer target packs the app on its way through, so
      # check-package still has a win-unpacked to look at.
      - run: npx electron-builder ${{ runner.os == 'Windows' && '--win nsis' || '--dir' }} --publish never
      - run: npm run check-package

  # One stable status to require in branch protection, whatever the matrix looks like.
  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, test, package]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Some CI jobs didn't pass"
            exit 1
          fi
