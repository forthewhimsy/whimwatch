name: Release

# Push a version tag (v1.2.3, or v1.2.3-beta.1 for a pre-release) to build installers for Windows,
# macOS and Linux plus a source archive, and attach them with checksums to a draft GitHub release.
# Nothing is public until the draft is published.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG has a section for this version
        run: |
          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::Add a '## [${{ steps.version.outputs.version }}]' section to CHANGELOG.md"
            exit 1
          fi

  test:
    name: Tests (${{ matrix.os }})
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Installers (${{ matrix.platform }})
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      # Optional signing. Without these secrets the installers are unsigned (macOS builds are ad-hoc
      # signed so they open after "Open Anyway").
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tools for the .rpm package
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run build
      - name: Build installers
        shell: bash
        run: |
          # Secrets that don't exist arrive as empty strings. electron-builder's macOS signing treats an
          # empty CSC_LINK as a certificate path ("… not a file"), so remove every empty one.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          args=(--${{ matrix.platform }} --publish never)
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "${{ matrix.platform }}" = mac ]; then
              # Ad-hoc signature: Apple silicon refuses to open an unsigned app ("damaged"). electron-builder's
              # default entitlements already allow this with the hardened runtime.
              args+=(-c.mac.identity=-)
            fi
          fi
          npx electron-builder "${args[@]}"
      - run: npm run check-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  source:
    name: Source archive
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive the tagged source
        run: |
          name="WhimWatch-${{ needs.verify.outputs.version }}-source"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          if-no-files-found: error
          retention-days: 7
          path: '*-source.tar.gz'

  publish:
    name: Draft the GitHub release
    needs: [verify, build, source]
    runs-on: ubuntu-latest
    # Uploading the installers takes a couple of minutes when GitHub is well; the default six-hour
    # limit only ever means a stalled upload burns the afternoon.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n' >> notes.md
          sed "s/{{version}}/$VERSION/g" .github/release-downloads.md >> notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          flags=(--draft --verify-tag --title "WhimWatch $VERSION" --notes-file notes.md)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac

          # The installers run to hundreds of megabytes and the upload is slow enough to time out.
          # Creating the release with its assets in one command isn't safe to retry: gh re-sends an
          # asset that had already landed, and GitHub refuses the duplicate name, failing the whole
          # release. So make the release first, then upload one file at a time with --clobber, which
          # replaces a half-uploaded asset instead of stopping on it.
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ -z "$draft" ]; then
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          elif [ "$draft" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME is already released. Bump the version instead of re-tagging."
            exit 1
          fi
          # An upload that stalls otherwise hangs the job for hours: GitHub's asset endpoint has
          # gone slow enough to sit on a single file for ten minutes with nothing transferred.
          # Each attempt is capped at five minutes and retried, which --clobber makes safe to
          # repeat. Five minutes is well clear of a real upload: the largest asset is ~125 MB,
          # under three minutes even at the worst throughput measured (0.8 MB/s), so the cap only
          # ever fires on a dead connection — and one of those is no likelier to come back at ten
          # minutes than at five. Don't go much below this: a slow but moving transfer that gets
          # killed starts again from zero.
          for asset in assets/*; do
            name=$(basename "$asset")
            for attempt in 1 2 3; do
              echo "Uploading $name (attempt $attempt)"
              if timeout 300 gh release upload "$GITHUB_REF_NAME" "$asset" --clobber --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::Gave up uploading $name after 3 attempts."
                exit 1
              fi
              sleep 15
            done
          done
